services:
  php:
    image: php:8.4-cli
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t public
    environment:
      # Remove this line to serve the built files from public/build instead.
      VITE_DEV_SERVER: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the container's Linux packages separate from the ones on your machine.
      - node_modules:/app/node_modules

volumes:
  node_modules:
